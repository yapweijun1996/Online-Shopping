<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Customer cart proposal — mobile, 390 by 844</title>
  <desc id="desc">Illustrative mobile Demo cart. The fixed setup action is directly above the existing five-item bottom navigation.</desc>
  <defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173950}.muted{fill:#58717d}.bold{font-weight:700}.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.3px;fill:#087f83}.price{fill:#a54428;font-weight:700}.productlink{text-decoration:underline;text-underline-offset:3px;text-decoration-color:#8095a0}</style></defs>
  <rect width="390" height="844" fill="#f5f8fa"/>
  <!-- Search is retained as the compact mobile header seen in the supplied cart capture. -->
  <rect x="12" y="8" width="366" height="44" rx="11" fill="#fff" stroke="#8095a0"/>
  <text x="30" y="36" font-size="15" fill="#6a7880">Search products</text>
  <path d="M331 8h36a11 11 0 0 1 11 11v22a11 11 0 0 1-11 11h-36z" fill="#317c82"/>
  <circle cx="352" cy="29" r="6" fill="none" stroke="#fff" stroke-width="1.7"/><path d="m356.5 33.5 4.5 4.5" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
  <!-- Demo disclosure -->
  <rect x="16" y="70" width="358" height="69" rx="12" fill="#fff6e4" stroke="#e9ca8a"/>
  <text x="28" y="91" font-size="12" font-weight="700" fill="#65480f">Demo — Pet Shop</text>
  <text x="28" y="110" font-size="11.5" fill="#65480f">Demo orders only · No payment, delivery or</text>
  <text x="28" y="126" font-size="11.5" fill="#65480f">automatic messages. Chat opens WhatsApp.</text>
  <text x="16" y="160" class="eyebrow">SHOP</text>
  <text x="16" y="197" font-size="29" font-weight="700" letter-spacing="-.6">Your cart</text>
  <!-- The old full-width warning is replaced by action-level guidance in the fixed bar. -->
  <rect x="16" y="220" width="358" height="232" rx="13" fill="#fff" stroke="#dce7eb"/>
  <rect x="33" y="244" width="22" height="22" rx="3" fill="#087f83"/><path d="m37 255 4 4 9-10" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="64" y="238" width="76" height="76" rx="9" fill="#f1edf7" stroke="#e4d9ee"/>
  <rect x="78" y="247" width="48" height="55" rx="5" fill="#fff" stroke="#9a79b1" stroke-width="1.2"/>
  <rect x="84" y="242" width="36" height="8" rx="2" fill="#76518f"/>
  <rect x="84" y="256" width="36" height="9" rx="2" fill="#e7dcef"/><text x="90" y="263" font-size="6.5" font-weight="700" fill="#76518f">PAWBRIGHT</text>
  <rect x="84" y="270" width="36" height="19" rx="2" fill="#76518f"/><text x="87" y="282" font-size="6" font-weight="700" fill="#fff">AIR REFILL</text>
  <text x="67" y="329" font-size="8.5" font-weight="700" letter-spacing=".45" fill="#58717d">ILLUSTRATION</text>
  <text x="153" y="246" class="productlink" font-size="14.5" font-weight="700">PawBright Air Refill</text>
  <text x="153" y="266" class="productlink" font-size="14.5" font-weight="700">(4 × 50 ml)</text>
  <text x="153" y="291" font-size="11.5" fill="#58717d">Odor Control</text>
  <text x="64" y="363" font-size="18" class="price">MYR</text><text x="64" y="383" font-size="18" class="price">34.89</text>
  <rect x="216" y="344" width="144" height="46" rx="9" fill="#fff" stroke="#8095a0"/>
  <path d="M260 345v44M315 345v44" stroke="#dce7eb"/><text x="231" y="374" font-size="21" font-weight="700" fill="#8095a0">−</text><text x="283" y="374" font-size="15">1</text><text x="334" y="374" font-size="21" font-weight="700">+</text>
  <text x="64" y="426" font-size="13" font-weight="700" fill="#355568">Remove</text>
  <text x="279" y="426" font-size="13" font-weight="700">MYR 34.89</text>
  <text x="16" y="484" font-size="13" fill="#58717d">Prices are checked again by the server when</text>
  <text x="16" y="502" font-size="13" fill="#58717d">you place an order.</text>
  <text x="16" y="534" font-size="14" text-decoration="underline">Continue shopping</text>
  <!-- Action bar: summary row + full-width next-step CTA, safe above bottom navigation. -->
  <rect x="0" y="662" width="390" height="118" fill="#fff"/><path d="M0 662.5H390" stroke="#8095a0"/>
  <rect x="16" y="675" width="20" height="20" rx="3" fill="#087f83"/><path d="m20 685 4 4 8-8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="46" y="690" font-size="12" fill="#355568">Select all</text>
  <text x="205" y="681" font-size="10.5" fill="#58717d">Estimated total</text><text x="205" y="701" font-size="17" class="price">MYR 34.89</text>
  <text x="16" y="715" font-size="10.5" fill="#65480f">Checkout needs your full name + WhatsApp or email.</text>
  <rect x="16" y="724" width="358" height="44" rx="11" fill="#087f83"/><text x="112" y="752" font-size="15" font-weight="700" fill="#fff">Set up profile to continue</text>
  <!-- Existing five-item mobile navigation; Cart remains active. -->
  <rect x="0" y="780" width="390" height="64" fill="#fff"/><path d="M0 780.5H390" stroke="#dce7eb"/>
  <path d="M30 801v-4l10-8 10 8v14H34v-9h12v9" fill="none" stroke="#58717d" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="29" y="834" font-size="10" fill="#58717d">Home</text>
  <path d="M109 793h18M109 800h18M109 807h18M109 814h18" stroke="#58717d" stroke-width="1.7" stroke-linecap="round"/>
  <text x="97" y="834" font-size="10" fill="#58717d">Category</text>
  <rect x="157" y="786" width="76" height="49" rx="11" fill="#eff8f6"/>
  <path d="M174 795h4l2 12h13l3-9h-16" fill="none" stroke="#205f64" stroke-width="1.7" stroke-linejoin="round"/><circle cx="183" cy="811" r="1.7" fill="#205f64"/><circle cx="191" cy="811" r="1.7" fill="#205f64"/>
  <circle cx="207" cy="793" r="8" fill="#087f83"/><text x="204.5" y="796" font-size="9" font-weight="700" fill="#fff">1</text>
  <text x="182" y="830" font-size="10" font-weight="700" fill="#205f64">Cart</text>
  <circle cx="270" cy="803" r="9" fill="none" stroke="#58717d" stroke-width="1.6"/><path d="M261 803h18M270 794c3 4 3 14 0 18M270 794c-3 4-3 14 0 18" fill="none" stroke="#58717d" stroke-width="1.2"/>
  <text x="250" y="834" font-size="10" fill="#58717d">Language</text>
  <circle cx="348" cy="799" r="5" fill="none" stroke="#58717d" stroke-width="1.6"/><path d="M340 815v-3a8 8 0 0 1 16 0v3" fill="none" stroke="#58717d" stroke-width="1.6" stroke-linecap="round"/>
  <text x="332" y="834" font-size="10" fill="#58717d">Account</text>
</svg>
