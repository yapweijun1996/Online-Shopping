<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="980" viewBox="0 0 1840 980" role="img" aria-labelledby="title desc">
  <title id="title">Seller portal layout proposal</title>
  <desc id="desc">Three vector design proposal frames: mobile Products, mobile Sales Orders with an available update, and desktop Products. These are illustrations, not application screenshots.</desc>
  <defs>
    <style>
