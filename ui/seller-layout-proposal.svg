      .eyebrow{font-size:11px;font-weight:800;letter-spacing:1.5px;fill:#087f83}
      .title{font-size:27px;font-weight:760;letter-spacing:-.8px}
      .body{font-size:13px;fill:#4f6b7b}
      .small{font-size:11px;fill:#58717d}
