      .cardtitle{font-size:15px;font-weight:750}
      .button{font-size:13px;font-weight:700}
      .tiny{font-size:10px;font-weight:750}
      .frame{fill:#f4f8fa;stroke:#cbdbe1;stroke-width:1.5}
