<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Customer cart proposal — desktop, 1440 by 900</title>
  <desc id="desc">Illustrative Demo cart with a required profile step placed beside the fixed checkout action.</desc>
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#173950}.muted{fill:#58717d}.small{font-size:13px}.tiny{font-size:11px}.bold{font-weight:700}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#087f83}.price{fill:#a54428;font-weight:700}.stroke{stroke:#8095a0}.focus{stroke:#087f83;stroke-width:3}.productlink{text-decoration:underline;text-underline-offset:3px;text-decoration-color:#8095a0}
    </style>
  </defs>
  <rect width="1440" height="900" fill="#f5f8fa"/>
  <!-- Desktop shop header -->
  <rect width="1440" height="76" fill="#fff"/>
  <path d="M0 75.5H1440" stroke="#dce7eb"/>
  <rect x="58" y="17" width="42" height="42" rx="12" fill="#087f83"/>
  <path d="M69 31h20v18H69zM73 31v-4h12v4M73 37h12" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/>
  <text x="110" y="46" font-size="21" font-weight="700">Shop</text>
  <rect x="281" y="16" width="650" height="44" rx="11" fill="#fff" stroke="#8095a0"/>
  <text x="300" y="44" font-size="15" fill="#6a7880">Search products</text>
  <path d="M879 16h41a11 11 0 0 1 11 11v22a11 11 0 0 1-11 11h-41z" fill="#317c82"/>
  <circle cx="899" cy="35" r="6" fill="none" stroke="#fff" stroke-width="1.8"/>
  <path d="m903.5 39.5 5 5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  <text x="1060" y="45" font-size="15" font-weight="700" fill="#355568">Browse</text>
  <rect x="1132" y="16" width="111" height="44" rx="11" fill="#e8f4f3"/>
  <path d="M1146 28h4l2 12h13l3-9h-16" fill="none" stroke="#205f64" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1155" cy="44" r="1.7" fill="#205f64"/><circle cx="1164" cy="44" r="1.7" fill="#205f64"/>
  <text x="1177" y="44" font-size="14" font-weight="700" fill="#205f64">Cart</text>
  <circle cx="1221" cy="38" r="12" fill="#d9efec"/><text x="1217.5" y="42" class="tiny bold" fill="#205f64">1</text>
  <rect x="1270" y="16" width="42" height="44" rx="11" fill="#fff" stroke="#8095a0"/>
  <circle cx="1291" cy="38" r="9" fill="none" stroke="#355568" stroke-width="1.6"/><path d="M1282 38h18M1291 29c3 4 3 14 0 18M1291 29c-3 4-3 14 0 18" fill="none" stroke="#355568" stroke-width="1.3"/>
  <rect x="1340" y="16" width="42" height="44" rx="11" fill="#fff" stroke="#8095a0"/>
  <circle cx="1361" cy="32" r="5" fill="none" stroke="#355568" stroke-width="1.7"/><path d="M1353 49v-3a8 8 0 0 1 16 0v3" fill="none" stroke="#355568" stroke-width="1.7" stroke-linecap="round"/>
  <!-- Demo disclosure -->
  <rect x="58" y="91" width="1324" height="43" rx="12" fill="#fff6e4" stroke="#e9ca8a"/>
  <text x="75" y="117" font-size="14" font-weight="700" fill="#65480f">Demo — Pet Shop</text>
  <text x="210" y="117" font-size="13" fill="#65480f">Demo orders only · No payment, delivery or automatic messages. Chat opens WhatsApp.</text>
  <!-- Page heading -->
  <text x="58" y="166" class="eyebrow">SHOP</text>
  <text x="58" y="214" font-size="38" font-weight="700" letter-spacing="-1.1">Your cart</text>
  <!-- Cart column headings -->
  <rect x="58" y="248" width="1324" height="54" rx="10" fill="#fff" stroke="#dce7eb"/>
  <text x="82" y="281" font-size="15" fill="#58717d">Product</text>
  <text x="816" y="281" font-size="15" fill="#58717d">Unit price</text>
  <text x="963" y="281" font-size="15" fill="#58717d">Quantity</text>
  <text x="1130" y="281" font-size="15" fill="#58717d">Item subtotal</text>
  <text x="1272" y="281" font-size="15" fill="#58717d">Actions</text>
  <!-- One synthetic Demo line -->
  <rect x="58" y="314" width="1324" height="140" rx="13" fill="#fff" stroke="#dce7eb"/>
  <rect x="87" y="369" width="21" height="21" rx="3" fill="#087f83"/>
  <path d="m92 379 4 4 8-9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="124" y="338" width="80" height="80" rx="9" fill="#f1edf7" stroke="#e4d9ee"/>
  <rect x="139" y="349" width="49" height="57" rx="5" fill="#fff" stroke="#9a79b1" stroke-width="1.3"/>
  <rect x="145" y="344" width="37" height="8" rx="2" fill="#76518f"/>
  <rect x="145" y="359" width="37" height="9" rx="2" fill="#e7dcef"/>
  <text x="151" y="366" font-size="7" font-weight="700" fill="#76518f">PAW</text>
  <rect x="145" y="373" width="37" height="17" rx="2" fill="#76518f"/>
  <text x="148" y="384" font-size="6.5" font-weight="700" fill="#fff">AIR REFILL</text>
  <text x="128" y="431" font-size="9" font-weight="700" letter-spacing=".5" fill="#58717d">ILLUSTRATION</text>
  <text x="224" y="369" class="productlink" font-size="16" font-weight="700">PawBright Air Refill (4 × 50 ml)</text>
  <text x="224" y="394" font-size="13" class="muted">Odor Control · Demo item</text>
  <text x="816" y="378" font-size="14" class="price">MYR 34.89</text>
  <rect x="951" y="354" width="144" height="46" rx="9" fill="#fff" stroke="#8095a0"/>
  <path d="M995 355v44M1049 355v44" stroke="#dce7eb"/>
  <text x="969" y="383" font-size="22" font-weight="700" fill="#8095a0">−</text>
  <text x="1013" y="383" font-size="16">1</text>
  <text x="1064" y="383" font-size="22" font-weight="700">+</text>
  <text x="1130" y="380" font-size="15" font-weight="700">MYR 34.89</text>
  <rect x="1267" y="354" width="90" height="46" rx="9" fill="#fff" stroke="#8095a0"/>
  <text x="1284" y="383" font-size="14" font-weight="700">Remove</text>
  <text x="58" y="489" font-size="14" class="muted">Prices are checked again by the server when you place an order.</text>
  <text x="58" y="524" font-size="15" fill="#173950" text-decoration="underline">Continue shopping</text>
  <!-- Persistent action area: profile requirement shares the checkout decision point -->
  <rect x="0" y="818" width="1440" height="82" fill="#fff"/>
  <path d="M0 818.5H1440" stroke="#8095a0"/>
  <rect x="34" y="849" width="20" height="20" rx="3" fill="#087f83"/>
  <path d="m38 859 4 4 8-9" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="66" y="864" font-size="14" class="muted">Select all</text>
  <text x="751" y="856" font-size="14">Selected items: 1</text>
  <text x="904" y="856" font-size="14">Estimated total</text>
  <text x="904" y="878" font-size="19" class="price">MYR 34.89</text>
  <rect x="1010" y="836" width="165" height="46" rx="10" fill="#fff6e4" stroke="#e9ca8a"/>
  <circle cx="1025" cy="851" r="7" fill="#edc974"/><text x="1023" y="855" font-size="10" font-weight="700" fill="#65480f">!</text>
  <text x="1038" y="855" font-size="11.5" font-weight="700" fill="#65480f">Profile required</text>
  <text x="1022" y="872" font-size="10" fill="#65480f">Full name + WhatsApp or email</text>
  <rect x="1188" y="834" width="194" height="48" rx="11" fill="#087f83"/>
  <text x="1203" y="864" font-size="13" font-weight="700" fill="#fff">Set up profile to continue</text>
</svg>
