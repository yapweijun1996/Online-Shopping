<svg xmlns="http://www.w3.org/2000/svg" viewBox="147 146 960 960" color="#087f83" role="img" aria-labelledby="title">
  <title id="title">Online Shopping</title>
  <!--
    One colour, several tints: every shape uses currentColor with an opacity, so the mark follows the page
    palette. In the shop and seller pages it is drawn with <use href="/favicon.svg#mark"> and takes the CSS
    `color` of the element that holds it. Opened on its own (tab icon, offline pages) it falls back to the
    default teal from the `color` attribute above.
  -->
