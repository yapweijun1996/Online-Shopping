    <path d="M195 490H378V520A91.5 91.5 0 0 1 195 520Z"/>
    <path fill-opacity=".22" d="M378 490H542V520A82 82 0 0 1 378 520Z"/>
    <path d="M542 490H712V520A85 85 0 0 1 542 520Z"/>
