services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${FRONTEND_HTTP_BIND:-127.0.0.1:8080}:80"
      - "${FRONTEND_HTTPS_BIND:-127.0.0.1:8443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - private
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in an ignored env file}
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      DB_PATH: /data/online-shopping.db
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:8080}
      TRUST_PROXY: "1"
    secrets:
      - admin_password
    volumes:
      - db_data:/data
    networks:
      - private
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

secrets:
  admin_password:
    file: ${ADMIN_PASSWORD_FILE_HOST:-./.local/admin-password}

volumes:
  db_data:
  caddy_data:
  caddy_config:

networks:
  edge:
  private:
    internal: true
