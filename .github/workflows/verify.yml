name: Verify new MVP

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shop_app
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: online_shopping
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop_app -d online_shopping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Tenant isolation and schema upgrade tests on PostgreSQL
        run: |
          printf 'ci-only-test-password' > "$RUNNER_TEMP/pg-password"
          node --test --test-concurrency=1 test/tenant.test.js test/postgres-upgrade.test.js
        env:
          PGTEST_HOST: 127.0.0.1
          PGTEST_PORT: '5432'
          PGTEST_DATABASE: online_shopping
          PGTEST_USER: shop_app
          PGTEST_PASSWORD_FILE: ${{ runner.temp }}/pg-password
      - run: npm run worker:check
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npm audit --omit=dev --audit-level=high

  postgres-compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: bash scripts/postgres-compose-smoke.sh
